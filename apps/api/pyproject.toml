[project]
name = "xiaoban-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "pyjwt[crypto]>=2.10,<3",
    "openai>=2,<3",
    "python-multipart>=0.0.20",
    "mutagen>=1.47",
    "httpx>=0.28,<1",
    "pillow>=13.0.0",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11",
    "mypy>=1.15",
    "imageio-ffmpeg>=0.8.1",
]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: paid external API tests"]
